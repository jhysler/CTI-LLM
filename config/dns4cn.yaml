topic: dns4cn
description: |
  China's proposed national DNS architecture (DNS4CN), authored by Fang Binxing
  and described in the Geedge / MESA leak. Part of the Shield-Cube (盾立方)
  framework. Aims to nationalize DNS resolution, block encrypted DNS resolvers
  globally, and reduce reliance on international root servers.

